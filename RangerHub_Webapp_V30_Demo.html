/* ============================================================
    – Ranger Hub / editorial adventure design
   Reference direction: contrasting editorial type, playful collage,

   Purely visual layer: no storage or schema changes.
   ============================================================ */
:root{
  --g:#17382b;--g2:#0d241c;--bg:#f3f1e9;--line:#e5e4d9;
  --mut:#67766c;--red:#a33e43;--v22-dark:#142a23;

html{scroll-behavior:smooth}

button,input,select,textarea{font-family:inherit}
button{transition:background .22s,color .22s,transform .22s,border-color .22s,box-shadow .22s}

.side{background:radial-gradient(circle at 110% 1%,rgba(213,248,99,.15),transparent 38%),linear-gradient(170deg,#142e25,#071b15 95%);padding:30px 15px 22px;box-shadow:14px 0 42px rgba(15,37,25,.06);z-index:3;overscroll-behavior:contain}
.side:before{content:'';display:block;width:38px;height:38px;border:1px solid rgba(230,255,104,.65);border-radius:50%;margin:2px 10px 18px;background:radial-gradient(circle at 50% 50%,#e6ff68 0 4px,transparent 5px),conic-gradient(from 45deg,transparent 0 22%,#e6ff68 22% 24%,transparent 24% 47%,#e6ff68 47% 49%,transparent 49% 72%,#e6ff68 72% 74%,transparent 74% 97%,#e6ff68 97% 99%,transparent 99%);transform:rotate(-15deg)}
.brand{font-size:26px;letter-spacing:-1.2px;line-height:1.1;margin:0 10px 32px;font-weight:850;color:#f8f7f0}

.nav{gap:5px}

function nextMissing(m){if(!m)return[];let out=[];db.cancellations.filter(x=>x.meetingId===m.id).forEach(x=>{let p=(x.kind==='leaders'?db.leaders:db.rangers).find(p=>p.id===x.personId);if(p)out.push({name:p.name,kind:x.kind==='leaders'?'Leiter':'Ranger',why:'Abgemeldet'})});db.absences.forEach(x=>{if(x.from<=m.date&&x.to>=m.date&&!out.some(p=>p.name===(x.kind==='leaders'?db.leaders:db.rangers).find(q=>q.id===x.personId)?.name)){let p=(x.kind==='leaders'?db.leaders:db.rangers).find(q=>q.id===x.personId);if(p)out.push({name:p.name,kind:x.kind==='leaders'?'Leiter':'Ranger',why:x.reason||'Abwesend'})}});return out}
function dash(){let todaysR=db.meetings.filter(x=>x.date===TODAY),todaysL=isLeader()?db.leaderMeetings.filter(x=>x.date===TODAY):[],last=db.meetings.filter(x=>x.date<TODAY).sort((a,b)=>b.date.localeCompare(a.date))[0],future=db.meetings.filter(x=>x.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)),next=future[0],missing=nextMissing(next);main.innerHTML=`<div class="top"><div><h1>Dashboard</h1><div class="muted">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div></div></div><div class="grid">${(todaysR.length||todaysL.length)?`<div class="card c12 today"><h2>Heute</h2>${todaysR.map(m=>`<div class="item click" onclick="openRangerMeeting(${m.id})"><b>Rangertreffen · ${m.start} Uhr</b><div>${m.theme}</div></div>`).join('')}${todaysL.map(m=>`<div class="item click" onclick="openLeaderMeeting(${m.id})"><b>Leitermeeting · ${m.start} Uhr</b><div>Informationen und Actions eintragen</div></div>`).join('')}</div>`:''}<div class="card" style="grid-column:span 7"><h3>Nächstes Rangertreffen</h3>${next?`<h2>${fmt(next.date)}</h2>${parts(next)}<button class="btn alt" onclick="openRangerMeeting(${next.id})">Öffnen</button>`:'Kein Termin'}</div><div class="card dashWeather"><div class="weatherHeader"><h3>Wettervorhersage für das Rangertreffen</h3><form class="weatherPlaceForm" onsubmit="changeWeatherPlace(event)"><input name="place" value="${esc(weatherPlace)}" placeholder="Ort eingeben" required><button class="btn sm">Ort ändern</button></form></div><div id="nextWeather" class="muted">Wetter wird geladen …</div></div><div class="card miniCal">${miniCalendarHtml(next)}</div><div class="card notComing"><h3>Beim nächsten Treffen nicht dabei</h3>${next?(missing.length?missing.map(p=>`<div class="personOff"><b>${esc(p.name)}</b> · ${p.kind}<div class="muted">${esc(p.why)}</div></div>`).join(''):'<div class="muted" style="margin-top:10px">Keine Abmeldungen oder geplanten Abwesenheiten eingetragen.</div>'):'<div class="muted">Kein function changeWeatherPlace(e){e.preventDefault();let v=new FormData(e.target).get('place').trim();if(!v)return;weatherPlace=v;db.weatherPlace=weatherPlace;v24Persist();let next=db.meetings.filter(x=>x.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date))[0],el=document.getElementById('nextWeather');if(el)el.innerHTML='<div class="muted">Wetter wird geladen …</div>';if(next)loadMeetingWeather(next)}
function weatherStyle(code){if(code===0||code===1)return['☀️','Sonnig','weatherSunny'];if(code===2||code===3)return['☁️','Bewölkt','weatherCloudy'];if(code===45||code===48)return['🌫️','Nebel','weatherFog'];if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return['🌧️','Regen','weatherRain'];if([71,73,75,77,85,86].includes(code))return['❄️','Schnee','weatherSnow'];if([95,96,99].includes(code))return['⛈️','Gewitter','weatherStorm'];return['☁️','Wetter','weatherCloudy']}
async function loadMeetingWeather(m){let el=document.getElementById('nextWeather');if(!el)return;let days=(new Date(m.date+'T12:00')-new Date(TODAY+'T12:00'))/86400000;if(days>16){el.innerHTML=`<div class="weatherCard weatherCloudy"><div><b>Noch keine Wetterprognose verfügbar</b><div class="muted">${fmt(m.date)} · ${esc(weatherPlace)}</div></div></div>`;return}try{let gr=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(weatherPlace)}&count=1&language=de&format=json`),gj=await gr.json(),loc=gj.results?.[0];if(!loc)throw Error();let u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&start_date=${m.date}&end_date=${m.date}`,r=await fetch(u),j=await r.json();if(!j.daily?.weather_code?.length)throw Error();let code=j.daily.weather_code[0],[ico,txt,cls]=weatherStyle(code),locationLabel=[loc.name,loc.admin1].filter(Boolean).join(', ');el.innerHTML=`<div class="weatherCard ${cls}"><div class="weatherIcon">${ico}</div><div><h2>${txt}</h2><b>${j.daily.temperature_2m_min[0]}–${j.daily.temperature_2m_max[0]} °C</b><div>Regen: ${j.daily.precipitation_probability_max[0]} %</div><div class="muted">${fmt(m.date)} · ${esc(locationLabel)}</div></div></div>`}catch(e){el.innerHTML=`<div class="weatherCard weatherCloudy"><div class="weatherIcon">📍</div><div><b>Ort nicht gefunden</b><div class="muted">${esc(weatherPlace)}</div></div></div>`}}

function calendar(){let first=new Date(calY,calM,1),start=(first.getDay()+6)%7,days=new Date(calY,calM+1,0).getDate(),cells='';for(let i=0;i<start;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,vs=vOn(ds),hs=hOn(ds),r=db.meetings.filter(x=>x.date===ds),l=isLeader()?db.leaderMeetings.filter(x=>x.date===ds):[],c=db.custom.filter(x=>x.date===ds),b=[...db.rangers,...db.leaders].filter(x=>x.birthday?.slice(5)===ds.slice(5));cells+=`<div class="day ${vs.length?'vac':''} ${hs.length?'hol':''}" onclick="${isLeader()?`addMenu('${ds}')`:''}"><b>${d}</b>${hs.map(x=>`<span class="holiday">${x[1]}</span>`).join('')}${r.map(x=>`<div class="event" onclick="event.stopPropagation();openRangerMeeting(${x.id})">Rangertreffen · ${x.start}</div>`).join('')}${l.map(x=>`<div class="event leader" onclick="event.stopPropagation();openLeaderMeeting(${x.id})">Leitermeeting · ${x.start}</div>`).join('')}${c.map(x=>`<div class="event custom">${esc(x.title)}</div>`).join('')}${b.map(x=>`<div class="event bday">Geburtstag · ${esc(x.name)}</div>`).join('')}${vs.length?`<div class="vacname">${vs[0][2]}</div>`:''}</div>`}main.innerHTML=`<div class="top"><h1>Kalender</h1></div><div class="card"><div class="calbar"><h2>${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><input type="month" min="2026-01" max="2029-12" value="${calY}-${String(calM+1).padStart(2,'0')}" onchange="let a=this.value.split('-');calY=+a[0];calM=+a[1]-1;calendar()"><div class="row"><button class="btn alt" onclick="seriesForm()">Serientermine planen</button><button class="btn" onclick="exportCal()">Exportieren</button></div></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join('')}${cells}</div></div>`}

function seriesForm(){if(!isLeader())return;box.innerHTML=`<h2>Serientermine planen</h2><form class="form" onsubmit="saveSeries(event)"><label>Terminart<select name="type"><option value="r">Rangertreffen</option><option value="l">Leitermeeting</option></select></label><label>Wochentag<select name="wd"><option value="1">Montag</option><option value="2">Dienstag</option><option value="3" selected>Mittwoch</option><option value="4">Donnerstag</option><option value="5">Freitag</option><option value="6">Samstag</option><option value="0">Sonntag</option></select></label><label>Von<input type="date" name="from" required></label><label>Bis<input type="date" name="to" required></label><label>Rhythmus<select name="rh"><option value="1">Jede Woche</option><option value="2" selected>Alle 2 Wochen</option><option value="3">Alle 3 Wochen</option><option value="4">Alle 4 Wochen</option></select></label><label>Start<input type="time" name="start" value="18:00"></label><label>Ende<input type="time" name="end" value="20:30"></label><label>Ort<input name="place" value="Demo-Treffpunkt"></label><button class="btn full">Serientermine anlegen</button></form>`;openM()}function saveSeries(e){e.preventDefault();let f=new FormData(e.target),d=new Date(f.get('from')+'T12:00'),to=new Date(f.get('to')+'T12:00'),wd=+f.get('wd');while(d.getDay()!=wd&&d<=to)d.setDate(d.getDate()+1);for(;d<=to;d.setDate(d.getDate()+7*+f.get('rh'))){let ds=d.toISOString().slice(0,10);if(f.get('type')==='l')db.leaderMeetings.push({id:Date.now()+d.getTime(),date:ds,start:f.get('start'),end:f.get('end'),place:f.get('place'),info:'',actions:[]});else db.meetings.push({id:Date.now()+d.getTime(),date:ds,start:f.get('start'),end:f.get('end'),place:f.get('place'),theme:'Rangertreffen',nature:{title:'',leaderId:null},action:{title:'',leaderId:null},impulse:{title:'',leaderId:null},food:{title:''},attendance:{rangers:{},leaders:{}}})}save();closeM()}
function cancel(mid){let i=db.cancellations.findIndex(x=>x.meetingId===mid&&x.kind===session.kind&&x.personId===session.id);if(i>=0)db.cancellations.splice(i,1);else db.cancellations.push({meetingId:mid,kind:session.kind,personId:session.id});save();openRangerMeeting(mid)}function openRangerMeeting(id){let m=db.meetings.find(x=>x.id===id),past=m.date<TODAY,c=db.cancellations.some(x=>x.meetingId===id&&x.kind===session.kind&&x.personId===session.id),cans=db.cancellations.filter(x=>x.meetingId===id);box.innerHTML=`<div class="top"><div><span class="pill">RANGERTREFFEN</span><h2>${fmt(m.date)} · ${m.start}–${m.end}</h2></div><button class="btn alt" onclick="closeM()">Schließen</button></div>${parts(m)}${!past?`<button class="bigCancel" onclick="cancel(${id})">${c?'Abmeldung zurücknehmen':'Abmeldung für dieses Treffen'}</button>`:''}${isLeader()?`<div class="card" style="margin-top:12px"><b>Abgemeldet:</b> ${cans.map(x=>(x.kind==='leaders'?db.leaders:db.rangers).find(p=>p.id===x.personId)?.name).join(', ')||'Niemand'}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="attendance(${id})">Anwesenheit pflegen</button></div>`:''}${past?`<div class="card" style="margin-top:12px">${lastSummary(m)}</div>`:''}`;openM()}
function attendance(id){let m=db.meetings.find(x=>x.id===id);box.innerHTML=`<div class="top"><h2>Anwesenheit · ${fmt(m.date)}</h2><button class="btn alt" onclick="closeM()">Schließen</button></div><h3>Ranger</h3>${db.rangers.map(p=>attRow(m,'rangers',p)).join('')}<h3>Leiter</h3>${db.leaders.map(p=>attRow(m,'leaders',p)).join('')}`;openM()}function attRow(m,k,p){let vals=['ANWESEND','ABWESEND','ENTSCHULDIGT'];return `<div class="item row between"><b>${p.name}</b><select onchange="mAtt(${m.id},'${k}',${p.id},this.value)">${vals.map(v=>`<option ${m.attendance?.[k]?.[p.id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`}function mAtt(mid,k,id,v){let m=db.meetings.find(x=>x.id===mid);m.attendance[k][id]=v;v24Persist()}
function leaderForm(id=0,date=''){let m=id?db.leaderMeetings.find(x=>x.id===id):null;box.innerHTML=`<h2>Leitermeeting</h2><form class="form" onsubmit="saveLeader(event,${id})"><label>Datum<input type="date" name="date" required value="${m?.date||date}"></label><label>Ort<input name="place" value="${esc(m?.place||'Demo-Treffpunkt')}"></label><label>Start<input type="time" name="start" value="${m?.start||'19:30'}"></label><label>Ende<input type="time" name="end" value="${m?.end||'21:00'}"></label><label class="full">Besprochene Informationen<textarea name="info" rows="5">${esc(m?.info||'')}</textarea></label><div class="full"><h3>Actions</h3><div id="acts">${(m?.actions||[]).map(a=>actRow(a)).join('')}</div><button type="button" class="btn alt sm" onclick="acts.insertAdjacentHTML('beforeend',actRow())">+ Action</button></div><button class="btn full">Speichern</button></form>`;openM()}function actRow(a={}){return `<div class="actionrow item"><input name="at" placeholder="Action" value="${esc(a.text||'')}"><select name="al"><option value="">Leiter</option>${db.leaders.map(l=>`<option value="${l.id}" ${a.leaderId===l.id?'selected':''}>${l.name}</option>`).join('')}</select><input type="date" name="ad" value="${a.due||''}"></div>`}function saveLeader(e,id){e.preventDefault();let f=new FormData(e.target),m=id?db.leaderMeetings.find(x=>x.id===id):{id:Date.now()};Object.assign(m,{date:f.get('date'),place:f.get('place'),start:f.get('start'),end:f.get('end'),info:f.get('info')});let t=f.getAll('at'),l=f.getAll('al'),d=f.getAll('ad');m.actions=t.map((x,i)=>({id:Date.now()+i,text:x,leaderId:+l[i]||null,due:d[i],done:false})).filter(x=>x.text);if(!id)db.leaderMeetings.push(m);save();closeM()}function openLeaderMeeting(id){if(!isLeader())return;let m=db.leaderMeetings.find(x=>x.id===id);box.innerHTML=`<div class="top"><div><span class="pill">LEITERMEETING</span><h2>${fmt(m.date)}</h2></div><button class="btn alt" onclick="closeM()">Schließen</button></div><div class="card"><h3>Bes function tasks(){let out=[];db.meetings.forEach(m=>[['nature','Naturphänomen'],['action','Aktion'],['impulse','Impuls']].forEach(([k,l])=>{if(m[k]?.leaderId===session.id)out.push({date:m.date,text:`${l} vorbereiten`,sub:m[k].title||m.theme,click:`openRangerMeeting(${m.id})`})}));db.leaderMeetings.forEach(m=>m.actions.filter(a=>a.leaderId===session.id&&!a.done).forEach(a=>out.push({date:a.due||m.date,text:a.text,sub:'Action aus Leitermeeting',click:`openLeaderMeeting(${m.id})`})));out.sort((a,b)=>a.date.localeCompare(b.date));main.innerHTML=`<div class="top"><h1>Meine Aufgaben</h1></div><div class="card list">${out.map(x=>`<div class="item click task" onclick="${x.click}"><div class="row between"><div><b>${esc(x.text)}</b><div class="muted">${esc(x.sub)}</div></div><span class="pill">${fmt(x.date)}</span></div></div>`).join('')||'Keine offenen Aufgaben'}</div>`}

async function loadMeetingWeather(m,target=null){
 const el=target||document.getElementById('nextWeather');if(!el)return;
 const genericPlace=!m.place||['Demo-Treffpunkt','Gemeindehaus'].includes(m.place);
 const forecastPlace=m.weatherPlace||(genericPlace?weatherPlace:m.place);
 const days=Math.round((new Date(m.date+'T12:00')-new Date((window.RangerHub?.localDate?.()||TODAY)+'T12:00'))/86400000);
 if(days>16||days<0){el.innerHTML=`<div class="weatherCard weatherCloudy"><div><b>Noch keine Wetterprognose verfügbar</b><div class="muted">${fmt(m.date)} · ${esc(forecastPlace)}</div></div></div>`;return}
 // Open-Meteo geocoding is retained for user-entered locations. No weather results are persisted.
 try{
  const gr=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(forecastPlace)}&count=1&language=de&format=json`);
  if(!gr.ok)throw Error('geocoding unavailable');
  const gj=await gr.json(),loc=gj.results?.[0];if(!loc)throw Error('place not found');
  const locationLabel=[loc.name,loc.admin1].filter(Boolean).join(', ')+(genericPlace?' · Wetterort des Stamms':'');
  if(days<=10&&loc.country_code==='DE'){
   try{
    const u=`https://api.brightsky.dev/weather?lat=${loc.latitude}&lon=${loc.longitude}&date=${m.date}`;
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),4500);
    let response;
    try{response=await fetch(u,{signal:controller.signal})}finally{clearTimeout(timer)}
    if(!response.ok)throw Error('DWD not available');
    const bw=await response.json();
    const hourly=(bw.weather||[]).filter(w=>w.timestamp&&new Date(w.timestamp).toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'})===m.date&&Number.isFinite(w.temperature));
    if(!hourly.length)throw Error('DWD forecast not available');
    const targetHour=Number((m.start||'18:00').slice(0,2));
    const selected=hourly.reduce((a,b)=>Math.abs(Number(new Date(b.timestamp).toLocaleString('sv-SE',{timeZone:'Europe/Berlin',hour:'2-digit',hour12:false}))-targetHour)<Math.abs(Number(new Date(a.timestamp).toLocaleString('sv-SE',{timeZone:'Europe/Berlin',hour:'2-digit',hour12:false}))-targetHour)?b:a);
    const temps=hourly.map(x=>x.temperature).filter(Number.isFinite);
    const rain=typeof selected.precipitation_probability==='number'?selected.precipitation_probability:null;
    el.innerHTML=v21WeatherBox({style:v21BrightStyle(selected),location:locationLabel,date:fmt(m.date),when:'zum Treffen · '+(m.start||'18:00')+' Uhr',min:Math.min(...temps),max:Math.max(...temps),rain,wind:typeof selected.wind_speed==='number'?selected.wind_speed:null,source:'DWD über Bright Sky'});
    return;
   }catch(dwdError){/* Continue with the existing Open-Meteo service as fallback. */}
  }
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FBerlin&start_date=${m.date}&end_date=${m.date}`;
  const res=await fetch(u);if(!res.ok)throw Error('forecast unavailable');
  const data=await res.json(),d=data.daily;if(!d?.weather_code?.length)throw Error('no daily forecast');
  const rain=d.precipitation_probability_max?.[0],wind=d.wind_speed_10m_max?.[0];
  el.innerHTML=v21WeatherBox({style:weatherStyle(d.weather_code[0]),location:locationLabel,date:fmt(m.date),min:d.temperature_2m_min?.[0],max:d.temperature_2m_max?.[0],rain,wind,source:'Open-Meteo'});
 }catch(e){
  el.innerHTML=`<div class="weatherCard weatherCloudy"><div class="weatherIcon">☁️</div><div><b>Wetterdaten aktuell nicht verfügbar</b><div class="muted">${esc(forecastPlace)} · Bitte Internet und Ortsnamen prüfen.</div></div></div>`;
 }
}

function v23SyncRangerStage(r){

function savePerson2(e,kind,id){
  if(!isLeader()&&!(id===session.id&&kind===session.kind)) return;
  e.preventDefault();
  const f=new FormData(e.target);
  const target=id?db[kind].find(x=>x.id===id):{id:v23NextId(db[kind])};
  ['name','team','birthday','mobile','email','address','address2','church','region'].forEach(k=>target[k]=String(f.get(k)||''));
  target.role = kind==='leaders' ? String(f.get('role')||'Leiter') : (target.role||'');
  if(kind==='leaders' && target.role==='Stammleiter'){
    db.leaders.forEach(l=>{ if(l!==target && /stammleiter/i.test(l.role||'')) l.role='Leiter'; });
  }
  if(kind==='rangers') target.stage = String(f.get('stage')||target.stage||'Beobachter');
  v23ApplyDefaultsToPerson(target,kind);
  const finish=()=>{ if(!id) db[kind].push(target); v23SyncAllStages(); v23Persist(); closeM(); render(); };
  const file=f.get('photo');
  if(file && file.size){ const r=new FileReader(); r.onload=()=>{ target.photo=r.result; finish(); }; r.readAsDataURL(file); } else finish();
}
function removePerson(kind,id){
  if(kind==='leaders' && !v23IsStammleiter()) return;
  if(kind==='rangers' && !isLeader()) return;
  const p=db[kind].find(x=>x.id===id); if(!p) return;
  if(!confirm(`${p.name} wirklich entfernen?`)) return;
  db[kind]=db[kind].filter(x=>x.id!==id);
  if(kind==='leaders'){
    (db.meetings||[]).forEach(m=>['nature','action','impulse'].forEach(k=>{ if(m[k]?.leaderId===id) m[k].leaderId=null; }));
    (db.leaderMeetings||[]).forEach(m=>(m.actions||[]).forEach(a=>{ if(a.leaderId===id) a.leaderId=null; }));
  } else {
    delete db.stageProgress?.[id]; delete db.observerProgress?.[id]; delete db.observerBonus?.[id];
  }
  if(session.kind===kind && session.id===id){ logout(); return; }
  v23Persist(); closeM(); render();
}

function saveOwnProfile(e){

function path(){
  const leader=isLeader(), pid=leader?null:session.id;
  const rows=stages.map((stage,i)=>{
    const available=leader||stageUnlockedForRanger(i,pid), finished=!leader&&stageDoneForRanger(stage,pid), pct=!leader?v23StagePercent(stage,pid):0, official=!leader && (currentUser()?.stage===stage);
    const action=leader?`${v21PencilIcon} Bearbeiten`:!available?'Ab 80% der vorherigen Stufe freigeschaltet':finished?'Stufe abgeschlossen':`${pct}% erreicht`;
    const symbol=leader?v21PencilIcon:!available?v21LockIcon:finished?v21CheckIcon:v21ArrowIcon;
    const cls=stage.toLowerCase();
    return `<button type="button" class="stageV21 ${cls} ${!available?'isLocked':''} ${finished?'isComplete':''}" onclick="stageClickV19('${stage}',${i})"><span class="stageNumber">${String(i+1).padStart(2,'0')}</span><span class="stageText"><span class="stageTitle">${esc(stage)}</span><span class="stageSubtitle">${esc(v21StageSubtitles[i])}${official?` · aktuelle Stufe`:''}</span><span class="stageAction">${action}</span>${!leader?`<span class="v23-stageCardNote">${stage==='Meister'?'Letzte Stufe des Pfads.':available&&!finished&&pct>=80&&i<stages.length-1?'Nächste Stufe ist bereits geöffnet.':finished&&i<stages.length-1?'Offizielle nächste Stufe erreicht.':'Arbeite in deinem Tempo weiter.'}</span>`:''}</span><span class="stageStatus" aria-hidden="true">${symbol}</span>${!leader?`<span class="stageMeter"><i style="width:${pct}%"></i></span>`:''}</button>`;
  }).reverse().join('');
  const officialStage=!leader?(currentUser()?.stage||'Beobachter'):'';
  main.innerHTML=`<section class="pathJourneyV21" aria-label="Interaktiver Wachstumspfad nach dem Demo-Logbuch"><div class="pathArtV21"><img src="${v21PathArt}" alt="Wachstumspfad aus dem Logbuch"></div><div class="pathSideV21"><div class="pathHeadV21"><div><div class="pathEyebrow">Ranger Hub · Wachstumspfad</div><h1>Dein Weg nach oben</h1><p>${leader?'Alle Stufen können vom Leiterteam gepflegt werden.':'Aktuelle offizielle Stufe: '+esc(officialStage)+' · Ab 80% wird die nächste Stufe freigeschaltet, bei 100% steigst du offiziell auf.'}</p></div><span class="pathCount">${leader?'Leiteransicht':esc(officialStage)}</span></div><div class="stageStackV21">${rows}</div><div class="pathFooterV21">Beginne unten bei Beobachter. Die Freischaltung erfolgt ab 80%, die Hochstufung erst bei 100%.</div></div></section>`;
}

 box.innerHTML=`<div class="top"><div><h2>${esc(stage)}</h2><div class="muted">Gemeinsame Aufgaben für beide Stämme</div></div><button class="btn alt" onclick="closeM()">Schließen</button></div><div class="v24-modalHelp">Die Aufgabenbibliothek gilt für Demo-West und Demo-Nord. Die individuellen Erledigungen werden je Stamm getrennt gespeichert.</div><div class="list" style="margin-top:12px">${tasks.map(t=>`<div class="item"><b>${esc(t.title)}</b><div class="muted">${esc(t.description||t.category||'')}</div>${v24IsAdmin()?`<button class="btn alt sm" onclick="growthTaskFormV16('${stage}',${t.id})">Bearbeiten</button>`:''}</div>`).join('')||'<div class="v24-empty">Noch keine Aufgaben vorhanden.</div>'}</div>${v24IsAdmin()?`<button class="btn" style="margin-top:12px" onclick="growthTaskFormV16('${stage}')">+ Aufgabe ergänzen</button>`:''}`;
 openM();
}

function v24LeaderCard(p){
 const visible=v24ShowContact(p,'leaders');
 const contacts=visible?`<div class="v23-personMeta">${v23PersonMeta(p,'leaders')}</div>`:`<div class="muted">${esc(p.church||v24StammName())}</div>`;
 const canEdit=v24CanManagePeople()||(session?.kind==='leaders'&&session.id===p.id&&session.homeStammId===v24StammId);
 return `<article class="v24-leaderCard"><div class="v24-leaderHead"><div class="v24-leaderAvatar">${esc(v24Initials(p.name))}</div><div><h3>${esc(p.name)}</h3><span class="v24-roleChip">${esc(p.role||'Leiter')}</span></div></div>${contacts}<div class="v24-leaderActions"><button class="btn alt sm" onclick="v24ShowLeaderProfile(${p.id})">Profil</button>${canEdit?`<button class="btn alt sm" onclick="personForm2('leaders',${p.id})">Bearbeiten</button>`:''}${v24CanManagePeople()&&p.role!=='Admin'&&(session.homeStammId!==v24StammId||session.id!==p.id)?`<button class="btn red sm" onclick="removePerson('leaders',${p.id})">Entfernen</button>`:''}</div></article>`;
}
function leaders(){
 main.innerHTML=`<div class="v24-mainHeading"><div><div class="v24-rangerHeadline">STAMM ${esc(v24StammName()).toUpperCase()}</div><h1>Leiterteam</h1><div class="muted">${db.leaders.length} Leiter · Rollen und Kontaktinformationen</div></div>${v24CanManagePeople()?`<button class="btn" onclick="personForm2('leaders')">+ Leiter hinzufügen</button>`:''}</div><div class="v24-note v24-modalHelp">${v24IsAdmin()?'Als Admin verwaltest du Leiter in beiden Stämmen.':v24IsStammleiter()?'Als Stammleiter verwaltest du das Leiterteam deines Stammes.':'Leiterprofile und Kontakte des eigenen Stammes.'}</div><div class="v24-leadersGrid">${db.leaders.map(v24LeaderCard).join('')}</div>`;
}
function v24ShowLeaderProfile(id){
 const p=db.leaders.find(l=>l.id===id);if(!p)return;
 const canEdit=v24CanManagePeople() || (session?.kind==='leaders' && session.id===id && session.homeStammId===v24StammId);
 const n=db.meetings.filter(m=>m.nature?.leaderId===id).length;
 const a=db.meetings.filter(m=>m.action?.leaderId===id).length;
 const i=db.meetings.filter(m=>m.impulse?.leaderId===id).length;
 box.innerHTML=`<div class="top"><div><h2>${esc(p.name)}</h2><span class="v24-roleChip">${esc(p.role||'Leiter')}</span></div><button class="btn alt" onclick="closeM()">Schließen</button></div><div class="v23-personMeta" style="margin-bottom:14px">${v24ShowContact(p,'leaders')?v23PersonMeta(p,'leaders'):'Stamm '+esc(v24StammName())}</div><div class="v24-details"><div class="v24-detail"><label>Naturphänomene</label><b>${n}× geleitet</b></div><div class="v24-detail"><label>Aktionen</label><b>${a}× geleitet</b></div><div class="v24-detail"><label>Impulse</label><b>${i}× geleitet</b></div></div>${canEdit?`<button class="btn" style="margin-top:14px" onclick="personForm2('leaders',${id})">Daten bearbeiten</button>`:''}`;
 openM();
}
function rangers(){
 v23SyncAllStages();
 main.innerHTML=`<div class="v24-mainHeading"><div><div class="v24-rangerHeadline">STAMM ${esc(v24StammName()).toUpperCase()}</div><h1>${isLeader()?'Ranger-Team':'Mein Rangerprofil'}</h1><div class="muted">${isLeader()?db.rangers.length+' Ranger · Fortschritt und Aufgaben':'Mein Wachstumspfad und meine Aufgaben'}</div></div>${v24CanManagePeople()?`<button class="btn" onclick="personForm2('rangers')">+ Ranger hinzufügen</button>`:''}</div><div class="v24-modalHelp">Neue Ranger beginnen als Beobachter mit der gelben Schulterschlaufe. Bei 80% wird die nächste Stufe geöffnet. Die offizielle Hochstufung erfolgt erst bei 100%.</div><div class="v24-rangerGrid">${(isLeader()?db.rangers:db.rangers.filter(r=>r.id===session?.id)).map(r=>{const stage=r.stage||'Beobachter',c=v24Count(stage,r.id);return `<button class="v24-rangerCard" onclick="v24RangerProfile(${r.id})"><span class="v24-rangerAvatar">${esc(v24Initials(r.name))}</span><span class="v24-rangerBody"><h3>${esc(r.name)}</h3><p>${esc(stage)} · ${esc(r.church||v24StammName())}</p><span class="v24-meter"><i style="width:${c.pct}%"></i></span></span><span class="v24-percent">${c.pct}%</span></button>`}).join('')}</div>`;
}

function personForm2(kind,id=0){
 const self=!!(id && session?.kind===kind && session.id===id && session.homeStammId===v24StammId);
 const canEdit=kind==='leaders'?(v24CanManagePeople()||self):id?(v24CanEditRanger(id)):v24CanManagePeople();
 if(!canEdit || !['leaders','rangers'].includes(kind))return;
 const p=id?db[kind].find(x=>x.id===id):{role:'Leiter',stage:'Beobachter',church:v24StammName()};
 if(!p)return;
 const canChangeRole=kind==='leaders'&&v24CanManagePeople()&&p.role!=='Admin';
 const roleField=kind==='leaders'?`<label>Rolle${canChangeRole?`<select name="role"><option value="Leiter" ${p.role!=='Stammleiter'?'selected':''}>Leiter</option><option value="Stammleiter" ${p.role==='Stammleiter'?'selected':''}>Stammleiter</option></select>`:`<input name="role" readonly value="${esc(p.role||'Leiter')}">`}</label>`:`<label>Offizielle Stufe<input readonly name="stage" value="${esc(p.stage||'Beobachter')}"></label>`;
 box.innerHTML=`<div class="top"><div><h2>${id?'Profil bearbeiten':kind==='leaders'?'Leiter hinzufügen':'Ranger hinzufügen'}</h2><div class="muted">Stamm ${esc(v24StammName())}</div></div><button class="btn alt" onclick="closeM()">Schließen</button></div><form onsubmit="savePerson2(event,'${kind}',${id})"><div class="v24-settingsForm"><label>Name<input name="name" required value="${esc(p.name||'')}"></label>${roleField}<label>Team / Funktion<input name="team" value="${esc(p.team||'')}"></label><label>Geburtsdatum<input name="birthday" type="date" value="${esc(p.birthday||'')}"></label><label>Telefon<input name="mobile" type="tel" value="${esc(p.mobile||'')}"></label><label>E-Mail<input name="email" type="email" value="${esc(p.email||'')}"></label><label>Adresse<input name="address" value="${esc(p.address||'')}"></label><label>Ort und Zusatz<input name="address2" value="${esc(p.address2||'')}"></label><label>Gemeinde<input name="church" value="${esc(p.church||v24StammName())}"></label><label>Gemeinde Region<input name="region" value="${esc(p.region||'')}"></label><label>Profilbild (optional)<input type="file" name="photo" accept="image/*"></label></div><div class="v24-modalHelp">${kind==='rangers'?'Die Wachstumsstufe wird aus erledigten Aufgaben automatisch berechnet. Neue Ranger beginnen immer als Beobachter.':'Die Admin-Rolle bleibt exklusiv RH vorbehalten.'}</div><button class="btn" style="width:100%;margin-top:14px" type="submit">Änderungen speichern</button></form>`;
 openM();
}
function savePerson2(e,kind,id){
 e.preventDefault();
 const self=!!(id&&session?.kind===kind&&session.id===id&&session.homeStammId===v24StammId);
 const allowed=kind==='leaders'?(v24CanManagePeople()||self):id?v24CanEditRanger(id):v24CanManagePeople();
 if(!allowed || !['leaders','rangers'].includes(kind))return;
 const original=id?db[kind].find(x=>x.id===id):null;
 if(id&&!original)return;
 const p=original||{id:v23NextId(db[kind])};
 const f=new FormData(e.target);
 ['name','team','birthday','mobile','email','address','address2','church','region'].forEach(k=>p[k]=String(f.get(k)||'').trim());
 if(kind==='leaders'){
  if(!original){p.role=v24CanManagePeople()&&f.get('role')==='Stammleiter'?'Stammleiter':'Leiter'}
  else if(p.role==='Admin')p.role='Admin';
  else if(v24CanManagePeople())p.role=f.get('role')==='Stammleiter'?'Stammleiter':'Leiter';
  if(p.role==='Stammleiter'){
   // Keep one local Stammleiter per Stamm; admin remains independent.
   db.leaders.forEach(other=>{if(other.id!==p.id&&other.role==='Stammleiter'){other.role='Leiter';other.team='Leiter'}});
  }
  if(p.role==='Leiter'&&!p.team)p.team='Leiter';
 }else if(!original){p.stage='Beobachter'}
 v23ApplyDefaultsToPerson(p,kind);
 const finish=()=>{
  if(!original)db[kind].push(p);
  if(kind==='rangers')v24SyncStageFor(p.id);
  v24Persist();closeM();render();
 };
 const file=f.get('photo');
 if(file&&file.size){const fr=new FileReader();fr.onload=()=>{p.photo=fr.result;finish()};fr.readAsDataURL(file)}else finish();
}
function removePerson(kind,id){
 if(!v24CanManagePeople()||!['leaders','rangers'].includes(kind))return;
 const p=db[kind].find(x=>x.id===id);if(!p)return;
 if(kind==='leaders'&&(p.role==='Admin'||p.id===session.id&&session.homeStammId===v24StammId))return;
 if(!confirm(`${p.name} wirklich aus dem Stamm ${v24StammName()} entfernen? Die alten Daten bleiben im Archiv erhalten.`))return;
 const archiveKey=kind==='leaders'?'archivedLeaders':'archivedRangers';
 db[archiveKey]=db[archiveKey]||[];
 db[archiveKey].push({...p,archivedAt:new Date().toISOString()});
 db[kind]=db[kind].filter(x=>x.id!==id);
 v24Persist();closeM();render();
}
function name(id){return db.leaders.find(x=>x.id===id)?.name||db.archivedLeaders?.find(x=>x.id===id)?.name||'Offen'}
function settings(){
 const p=v24Principal();if(!p)return;
 box.innerHTML=`<div class="top"><div><h2>Mein Profil</h2><div class="muted">${esc(v24RoleTitle())} · Stamm ${esc(v24StammName(session.homeStammId||v24StammId))}</div></div><button class="btn alt" onclick="closeM()">Schließen</button></div><form onsubmit="saveOwnProfile(event)"><div class="v24-settingsForm"><label>Name<input name="name" required value="${esc(p.name||'')}"></label><label>Rolle<input readonly value="${esc(v24RoleTitle())}"></label><label>Team / Funktion<input name="team" value="${esc(p.team||'')}"></label><label>Geburtsdatum<input type="date" name="birthday" value="${esc(p.birthday||'')}"></label><label>Telefon<input type="tel" name="mobile" value="${esc(p.mobile||'')}"></label><label>E-Mail<input type="email" name="email" value="${esc(p.email||'')}"></label><label>Adresse<input name="address" value="${esc(p.address||'')}"></label><label>Ort und Zusatz<input name="address2" value="${esc(p.address2||'')}"></label><label>Gemeinde<input name="church" value="${esc(p.church||'')}"></label><label>Gemeinde Region<input name="region" value="${esc(p.region||'')}"></label><label>Profilbild<input type="file" name="photo" accept="image/*"></label></div><button class="btn" style="margin-top:14px;width:100%" type="submit">Meine Daten speichern</button></form>${v24IsAdmin()?`<div class="v24-modalHelp" style="margin-top:18px"><b>Stammdaten sichern</b><br>Exportiert alle Daten beider Stämme als JSON-Datei. Enthält auch persönliche Kontaktdaten – sicher aufbewahren.</div><div class="v24-backupActions"><button type="button" class="btn alt" onclick="v24ExportBackup()">Gesamtes Backup exportieren</button><label class="btn alt" style="cursor:pointer;text-align:center">Backup importieren<input type="file" accept=".json,application/json" onchange="v24ImportBackup(event)" style="position:absolute;width:1px;height:1px;opacity:0"></label></div>`:''}`;
 openM();
}
function saveOwnProfile(e){
 e.preventDefault();const p=v24Principal();if(!p)return;
 const f=new FormData(e.target);
 ['name','team','birthday','mobile','email','address','address2','church','region'].forEach(k=>p[k]=String(f.get(k)||'').trim());
 const finish=()=>{v24Persist();closeM();render()};
 const file=f.get('photo');if(file&&file.size){const fr=new FileReader();fr.onload=()=>{p.photo=fr.result;finish()};fr.readAsDataURL(file)}else finish();
}

dash=function(){v24BaseDash();
 const hero=main.querySelector('.v23-hero');
 if(hero){

  const copy=hero.querySelector('.v23-copy>p');if(copy)copy.textContent='Termine, Geburtstage, Rangerfortschritte und Ansprechpartner – alles an einem Platz.';
  const artwork=hero.querySelector('.v23-paper img');if(artwork)artwork.style.objectPosition='center 40%';const note=hero.querySelector('.v23-paperNote');if(note)note.textContent='Illustration aus dem Demo-Logbuch';
 }
 // Update quick accessibility: the dashboard title is a graphic-based entrance, not a redundant heading.
 const sideDash=root.querySelector('.nav>button');if(sideDash){sideDash.innerHTML='⌂ &nbsp;Start';sideDash.setAttribute('aria-label','Startseite')}
};

function v24ExportBackup(){
 if(!v24IsAdmin())return;
 v24Persist();
 const data=JSON.stringify(v24Store,null,2);
 const blob=new Blob([data],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='RangerHub_Stammdaten_'+new Date().toISOString().slice(0,10)+'.json';
 a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
}
async function v24ImportBackup(e){
 if(!v24IsAdmin())return;
 const file=e.target.files?.[0];if(!file)return;
 try{
  const parsed=JSON.parse(await file.text());
  if(!parsed.__rhv24 || !parsed.stamms?.['clp-west']?.leaders || !parsed.stamms?.meppen?.leaders || !parsed.shared?.growthTasks)throw Error('Kein gültiges -Stammdaten-Backup.');
  if(!confirm('Dieses Backup ersetzt ALLE aktuell gespeicherten Daten von Demo-West und Demo-Nord in diesem Browser. Wirklich importieren?'))return;
  const previous=v24Store;
  v24Store=parsed;v24StammId='clp-west';
  try{
   v24ActivateStamm('clp-west');
   v24EnsureAdmin();v24Persist();
   session=null;sessionStorage.removeItem('rhv9-demo-session');view='dash';closeM();render();
   alert('Backup importiert. Bitte Profil neu auswählen.');
  }catch(error){v24Store=previous;throw error}
 }catch(error){alert('Import fehlgeschlagen: '+error.message)}
}

v24EnsureAdmin();
v24Persist();
render();
